name: Merge Master to Atriarch
# Runs after Sync Upstream to Master completes. Merges newly-mirrored upstream
# commits from master into the customization branch atriarch.

on:
  workflow_run:
    workflows: ["Sync Upstream to Master"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read  # App token is used for writes; GITHUB_TOKEN stays read-only

jobs:
  merge-to-atriarch:
    if: github.repository == 'Atriarch-Systems/LinuxGSM'
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Checkout atriarch
        uses: actions/checkout@v4
        with:
          ref: atriarch
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "atriarch-fork-sync[bot]"
          git config user.email "atriarch-fork-sync[bot]@users.noreply.github.com"

      - name: Fetch master
        run: git fetch origin master

      - name: Check for new commits
        id: check
        run: |
          MASTER_SHA=$(git rev-parse origin/master)
          MERGE_BASE=$(git merge-base HEAD origin/master)
          if [ "$MASTER_SHA" != "$MERGE_BASE" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            COMMIT_COUNT=$(git rev-list --count HEAD..origin/master)
            echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge master into atriarch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git merge origin/master --no-edit -m "chore: merge upstream changes from master"
          git push origin atriarch

      - name: No changes
        if: steps.check.outputs.has_changes == 'false'
        run: echo "Atriarch branch is already up to date with master"
