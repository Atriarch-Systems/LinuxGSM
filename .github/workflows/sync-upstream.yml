name: Sync Upstream to Master
# Force-syncs the master branch from GameServerManagers/LinuxGSM.
# master is the pure upstream mirror; atriarch carries Atriarch customizations.
#
# Auth: Uses the atriarch-fork-sync GitHub App instead of GITHUB_TOKEN so the
# workflow can update workflow files when upstream changes them.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read  # App token is used for writes; GITHUB_TOKEN stays read-only

jobs:
  sync-upstream:
    if: github.repository == 'Atriarch-Systems/LinuxGSM'
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "atriarch-fork-sync[bot]"
          git config user.email "atriarch-fork-sync[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/GameServerManagers/LinuxGSM.git || true
          git fetch upstream master

      - name: Sync master branch
        run: |
          git reset --hard upstream/master
          git push origin master --force
