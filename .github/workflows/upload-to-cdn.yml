name: Upload LinuxGSM Assets to CDN
# Mirrors linuxgsm.sh + the dependency CSVs to the Atriarch CDN so container
# builds/boots don't depend on GitHub raw (rate limits).
#
# The CDN's legacy path-based upload plane (PUT /api/files/...) died with the
# SeaweedFS migration - uploads now go to the S3 plane (bucket "agent", prefix
# "public/"), and objects serve anonymously at:
#   https://cdn.atriarch.systems/File/agent/o/lgsm/<path>
# Consumers still pointing at the old cdn.atriarch.systems/lgsm/... URLs 404
# and use their GitHub fallbacks until repointed to the File/agent/o/ shape.
#
# Uploads go over HTTPS to s3.atriarch.systems (gateway cert includes the s3
# SAN as of 2026-07-18); SigV4 never transmits the secret key.

on:
  push:
    branches: [atriarch]
    paths:
      - 'linuxgsm.sh'
      - 'lgsm/data/**'
      - '.github/workflows/upload-to-cdn.yml'
  workflow_dispatch:

jobs:
  upload-to-cdn:
    if: github.repository == 'Atriarch-Systems/LinuxGSM'
    runs-on: [self-hosted, Linux, X64, amd64, arc-amd64]
    env:
      S3_ENDPOINT: https://s3.atriarch.systems
      S3_BUCKET: agent
      S3_PREFIX: public/lgsm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: atriarch

      - name: Upload linuxgsm.sh + data CSVs to CDN (S3 plane)
        env:
          AK: ${{ secrets.CDN_S3_ACCESS_KEY }}
          SK: ${{ secrets.CDN_S3_SECRET_KEY }}
        run: |
          upload() {
            local file="$1" key="$2" ctype="$3"
            local code
            code=$(curl -s -o /tmp/up-body.txt -w "%{http_code}" \
              --aws-sigv4 "aws:amz:us-east-1:s3" --user "${AK}:${SK}" \
              -H "Content-Type: ${ctype}" \
              -T "${file}" "${S3_ENDPOINT}/${S3_BUCKET}/${S3_PREFIX}/${key}")
            if [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]; then
              echo "OK  ${key} (HTTP ${code})"
            else
              echo "FAIL ${key} (HTTP ${code})"
              head -c 300 /tmp/up-body.txt; echo ""
              return 1
            fi
          }

          fails=0
          upload linuxgsm.sh linuxgsm.sh application/octet-stream || fails=$((fails+1))
          for file in lgsm/data/*.csv; do
            [ -f "$file" ] || continue
            upload "$file" "data/$(basename "$file")" text/csv || fails=$((fails+1))
          done

          echo ""
          echo "Verifying via the public CDN read path..."
          curl -fsS -o /dev/null "https://cdn.atriarch.systems/File/agent/o/lgsm/linuxgsm.sh" \
            && echo "OK  cdn.atriarch.systems/File/agent/o/lgsm/linuxgsm.sh" \
            || { echo "FAIL public read-back"; fails=$((fails+1)); }

          [ "${fails}" -eq 0 ]
        continue-on-error: true

      - name: Summary
        run: |
          echo "## CDN Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Files mirrored to the CDN S3 plane, served at:" >> $GITHUB_STEP_SUMMARY
          echo "- https://cdn.atriarch.systems/File/agent/o/lgsm/linuxgsm.sh" >> $GITHUB_STEP_SUMMARY
          echo "- https://cdn.atriarch.systems/File/agent/o/lgsm/data/*.csv" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "On upload failure, builds keep using Atriarch-Systems/LinuxGSM GitHub raw URLs." >> $GITHUB_STEP_SUMMARY
